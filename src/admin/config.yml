# Decap CMS Configuration
# Docs: https://decapcms.org/docs/configuration-options/
#
# AUTH SETUP REQUIRED before production use:
#   Option A (recommended): Register site on Netlify (free) for OAuth proxy.
#     Add `base_url: https://api.netlify.com` and `auth_endpoint: auth` under backend.
#   Option B: Register a GitHub OAuth App and self-host a small proxy.
#
# LOCAL DEVELOPMENT:
#   Run `npx @decap/cms-proxy-server` alongside `npm start`
#   Then visit http://localhost:8080/admin to edit content.

backend:
  name: github
  repo: AzadiGathui/portfolio-1
  branch: master
  # Uncomment after setting up Netlify OAuth proxy:
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Enables draft/review workflow before publishing
publish_mode: editorial_workflow

# Where uploaded media files are stored and referenced
media_folder: src/assets/images/uploads
public_folder: /assets/images/uploads

collections:
  # ─── PROJECTS ───────────────────────────────────────────────
  - name: projects
    label: Projects
    folder: src/projects
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Title Superscript", name: titleSup, widget: string, required: false,
          hint: "Small raised text after the project page title, e.g. a year or edition (2024, COP27)." }
      - { label: "Page Heading", name: headline, widget: string, required: false,
          hint: "The big heading on the project page, when it should differ from the Title (the Title is what the homepage cards and the next/previous links use)." }
      - { label: "Full-width Story", name: sidebar, widget: boolean, default: true, required: false,
          hint: "Switch off to drop the contents list beside the story: it then runs the full width, with its headings and text in a centred column." }
      - { label: "Tagline", name: tagline, widget: string,
          required: false,
          hint: "Not shown on the site at the moment: the description is shown under the title instead." }
      - { label: "Client", name: client, widget: string }
      - { label: "Industry", name: industry, widget: string, required: false,
          hint: "The label above the title, on the homepage card and the project page." }
      - { label: "Role", name: role, widget: string }
      - { label: "Timeline", name: timeline, widget: string, required: false,
          hint: "Shown in the project's facts, e.g. Apr 2025 – Sep 2026." }
      - { label: "Platform", name: platform, widget: string, required: false,
          hint: "Shown in the project's facts, e.g. Installable web app (PWA), Android first." }
      - { label: "Deliverables", name: deliverables, widget: string,
          hint: "Shown under the title on the homepage card, and in the project's facts." }
      # Declared here so the editor shows them and keeps them when an entry is saved
      - label: "Team"
        name: team
        widget: list
        required: false
        hint: "The people who did the work with you, shown in the project's facts. With a photo for everyone it is a row of faces (name and role on hover or tap); without, a list of names and roles."
        fields:
          - { label: "Name", name: name, widget: string }
          - { label: "Role", name: role, widget: string }
          - { label: "Profile link", name: url, widget: string, required: false,
              hint: "Links the name or face to their profile, e.g. LinkedIn." }
          - { label: "Photo", name: photo, widget: image, required: false,
              hint: "Square, shown at 56px." }
      - label: "Research"
        name: research
        widget: object
        required: false
        hint: "The research section of a case study: the steps taken, the sources behind it, the question it led to and the key findings. Place it in the Body with the research include."
        fields:
          - { label: "Question", name: question, widget: string,
              hint: "The how-might-we the research led to." }
          - label: "Figure"
            name: figure
            widget: object
            required: false
            hint: "A picture under the question."
            fields:
              - { label: "Image", name: src, widget: image }
              - { label: "Alt text", name: alt, widget: string, required: false,
                  hint: "Describe what it shows, for people who can't see it." }
              - { label: "Width", name: width, widget: number, value_type: int, required: false, default: 248,
                  hint: "In pixels, on a wide screen." }
          - label: "Timeline"
            name: timeline
            widget: list
            required: false
            hint: "The steps taken, shown above the sources."
            fields:
              - { label: "Step", name: title, widget: string }
              - { label: "Points", name: points, widget: list, required: false,
                  field: { label: "Point", name: point, widget: string } }
          - label: "Findings"
            name: findings
            widget: list
            hint: "Keep them in the order of the rules they led to: the Nth finding links to the Nth rule."
            fields:
              - { label: "Finding", name: title, widget: string }
              - { label: "Detail", name: detail, widget: text, required: false }
              - { label: "Rule it led to", name: rule, widget: string, required: false,
                  hint: "Shown under the detail as a link to the Nth rule card (give that card id=rule-N, and link its label back to finding-N)." }
          - label: "Sources"
            name: sources
            widget: list
            hint: "What was read, watched and seen. A source without a link reads as a photo of your own."
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Image", name: image, widget: image }
              - { label: "Alt text", name: alt, widget: string, required: false }
              - { label: "Link", name: url, widget: string, required: false,
                  hint: "The original source. Opens in a new tab." }
          - { label: "Seconds per source", name: cycle, widget: number, value_type: int, required: false, default: 4,
              hint: "How long each source stays on top while the pile cycles." }
      - { label: "Homepage Order", name: order, widget: number, value_type: int,
          hint: "Lower number = earlier on the homepage. The first five are Selected work. Use 1, 2, 3…" }
      - { label: "Published", name: published, widget: boolean, default: true,
          hint: "Uncheck to hide from homepage without deleting the page." }
      - { label: "Cover Image", name: coverImage, widget: image,
          hint: "The photo behind the artefact, in grey, on the homepage card and the project page." }
      - { label: "Cover Position", name: coverPosition, widget: string, required: false,
          hint: "Which part of the cover photo stays in view when it is cropped, as a CSS object-position, e.g. 50% 20%." }
      - { label: "Mockup Image", name: mockupImage, widget: image, required: false,
          hint: "A phone screen, shown in the phone mockup when Artefact kind is phone." }
      - { label: "Client Logo", name: clientLogo, widget: image, required: false,
          hint: "Not shown on the site at the moment." }
      - { label: "Thumbnail", name: thumbnail, widget: image,
          hint: "The artefact laid on the cover (a print or report mockup, cut out on transparency), and the thumbnail in lists." }
      - { label: "Artefact kind", name: thumbnailKind, widget: select, required: false,
          options: ["phone", "print", "book"],
          hint: "How the artefact is laid on the cover: a framed phone (uses the Mockup Image), a paper print (charts, maps), or a book/report mockup." }
      - { label: "OG Image", name: ogImage, widget: image, required: false,
          hint: "Social sharing image: 1200×630px recommended." }
      - { label: "Permalink", name: permalink, widget: string,
          hint: "URL path, e.g. /projects/project-name/ (include trailing slash)." }
      - { label: "SEO Description", name: description, widget: text, required: false,
          hint: "Shown under the title on the project page, and in search results. 150–160 characters." }
      - { label: "Body", name: body, widget: markdown,
          hint: "Main case study content. Supports Markdown and raw HTML (for Tableau embeds, galleries, etc.)." }

  # ─── ARTICLES ───────────────────────────────────────────────
  - name: articles
    label: Articles
    folder: src/articles
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Date", name: date, widget: datetime }
      - { label: "Published", name: published, widget: boolean, default: false }
      - { label: "Description", name: description, widget: text, required: false }
      - { label: "Cover Image", name: coverImage, widget: image, required: false }
      - { label: "Body", name: body, widget: markdown }
