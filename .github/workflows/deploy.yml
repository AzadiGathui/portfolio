name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - master

# Allow pushing to the gh-pages branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24" # current LTS; Node 20 reached end of life in April 2026
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Optimised images (AVIF/WebP) take ~2–3 minutes to generate from scratch.
      # Keep them between deploys; the image tool skips files that already exist.
      # The key changes whenever an image or the image settings change.
      - name: Restore optimised images
        uses: actions/cache@v6
        with:
          path: _site/img
          key: img-${{ hashFiles('src/assets/images/**', '.eleventy.js', 'package-lock.json') }}

      - name: Build Eleventy site
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # CNAME is passthrough-copied by Eleventy config — do NOT set cname: here
          # as it would conflict with the file already in _site/
